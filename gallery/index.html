<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Gallery | Atlas Relics</title>
<meta name="description" content="Preview the Atlas Relics products referenced throughout the Four Stages of Consciousness quiz results.">
<link rel="canonical" href="https://fourstagesquiz.com/gallery/">
<link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="brand">Atlas Relics</a>
    <nav class="site-nav" aria-label="Site">
      <a href="/gallery/" aria-current="page">Gallery</a>
      <a href="/leads/">Leads</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="page-intro">
    <h1>Product Gallery</h1>
    <p>A look at the products behind each stage of the quiz. Images below are placeholders until final product photography is ready.</p>
  </section>

  <section aria-label="Product previews">
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Atlas Relics &middot; Atlas Reed</p>
  </div>
</footer>

<dialog id="lightbox" aria-label="Image viewer">
  <div class="lightbox-body">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption">
      <div class="name" id="lightbox-name"></div>
      <div class="desc" id="lightbox-desc"></div>
    </div>
    <div class="lightbox-nav">
      <button type="button" class="btn" id="lightbox-prev" aria-label="Previous image">&larr; Previous</button>
      <button type="button" class="btn" id="lightbox-close">Close</button>
      <button type="button" class="btn" id="lightbox-next" aria-label="Next image">Next &rarr;</button>
    </div>
  </div>
</dialog>

<script type="module" src="/gallery/app.js" defer></script>

</body>
</html>
